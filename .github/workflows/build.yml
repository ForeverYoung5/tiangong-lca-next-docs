name: Build/release

# Version tag release gate. v4 §6.3: EdgeOne Makers Git integration is the
# only hosting publisher — this workflow performs validation only and never
# deploys (the legacy Cloudflare Pages deploy job was removed in P1).
on:
  push:
    tags:
      - 'v*'

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Set up pnpm 11.22.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: pnpm

      - name: Run docpact release gate
        run: |
          set -euo pipefail
          release_head="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          release_base="$(git rev-parse "${release_head}^")"
          scripts/docpact-gate.sh --base "$release_base" --head "$release_head"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (ci fixture)
        env:
          DEPLOY_ENV: ci
          CANONICAL_ORIGIN: http://localhost:3000
          NEXT_PUBLIC_SEARCH_MODE: static
          SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build
