version: 1
layout: repo
lastReviewedAt: "2026-08-22"
lastReviewedCommit: "e76d5571a6fa495e103576e2a69a9c2407522458"
reviewNote: "Reviewed for P0C (issue #131): transition-aware routing — new Fumadocs paths added, legacy paths retained until P1/P2."
lastReviewedNote: "Reviewed for UI polish batch (issue #131): language switcher displayName fix (was all-English), light/dark brand logos from product assets with explicit dimensions, Algolia attribution moved inside the search dialog (prebuilt component rendered it page-resident), search client memoization (infinite re-render fix)."

catalog:
  repos:
    - id: next-docs
      path: .
      canonicalRepo: linancn/tiangong-lca-next-docs
      entryDoc: AGENTS.md
      workflowDocs:
        - docs/agents/repo-validation.md
        - docs/agents/repo-architecture.md
        - docs/agents/migration-cutover-runbook.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - TODO.docs-system-gaps.md
          - .docpact/config.yaml
          - docs/agents/**
          - .github/workflows/ai-doc-lint.yml
          - .github/workflows/publish-docs.yml
      ownerRepo: next-docs
    - id: public-doc-content
      paths:
        include:
          - content/docs/**
          - public/assets/docs/**
          - public/favicon.ico
          - public/logo.svg
      ownerRepo: next-docs
    - id: docs-site-structure
      paths:
        include:
          - package.json
          - tsconfig.json
          - next.config.ts
          - edgeone.json
          - postcss.config.mjs
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - app/**
          - lib/**
          - components/**
          - crowdin.yml
          - scripts/migration/**
          - context7.json
          - scripts/generate-llms-txt.mjs
          - scripts/check-publication-scope.mjs
          - scripts/publication-policy.mjs
      ownerRepo: next-docs

    - id: local-docpact-push-gate
      paths:
        include:
          - .githooks/**
          - scripts/docpact
          - scripts/docpact-gate.sh
          - scripts/install-git-hooks.sh
      ownerRepo: next-docs

coverage:
  include:
    - .githooks/**
    - scripts/docpact
    - scripts/docpact-gate.sh
    - scripts/install-git-hooks.sh
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/**
    - context7.json
    - scripts/check-screenshots.mjs
    - scripts/check-screenshots.test.mjs
    - package.json
    - tsconfig.json
    - .github/workflows/ai-doc-lint.yml
    - .github/workflows/publish-docs.yml
    - content/docs/**
    - public/assets/docs/**
    - public/favicon.ico
    - public/logo.svg
    - scripts/build.mjs
    - scripts/check-env.mjs
    - scripts/verify-out.mjs
    - next.config.ts
    - edgeone.json
    - postcss.config.mjs
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - app/**
    - lib/**
    - components/**
    - crowdin.yml
    - scripts/migration/**
    - manifests/**
  exclude:
    - .git/**
    - .github/scripts/**
    - .docpact/runs/**
    - node_modules/**
    - .next/**
    - out/**
    - .source/**

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    local-docpact-gate:
      paths:
        - .githooks/pre-push
        - scripts/docpact
        - scripts/docpact-gate.sh
        - scripts/install-git-hooks.sh
    public-content:
      paths:
        - content/docs/**
        - public/assets/docs/**
    site-structure:
      paths:
        - package.json
        - tsconfig.json
        - next.config.ts
        - edgeone.json
        - postcss.config.mjs
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - app/**
        - lib/**
        - components/**
        - crowdin.yml
        - scripts/migration/**
        - context7.json
        - scripts/check-screenshots.mjs
        - scripts/check-screenshots.test.mjs
        - scripts/build.mjs
        - scripts/check-env.mjs
        - scripts/verify-out.mjs
        - .github/workflows/publish-docs.yml
    drift-backlog:
      paths:
        - TODO.docs-system-gaps.md
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - docs/agents/**
        - .github/workflows/ai-doc-lint.yml
    proof:
      paths:
        - docs/agents/repo-validation.md
        - package.json
        - next.config.ts
        - app/**
        - lib/**
        - components/**
    root-integration:
      paths:
        - AGENTS.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - TODO.docs-system-gaps.md
    - .docpact/config.yaml
    - docs/agents/repo-validation.md
    - docs/agents/repo-architecture.md

repo:
  id: next-docs
  owner: next-docs

rules:
  - id: next-docs-bootstrap-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-ai-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
      - path: docs/agents/migration-cutover-runbook.md
        kind: deep-doc
      - path: ai/**
        kind: legacy-doc-ai-layer
      - path: .github/scripts/ai-doc-lint.mjs
        kind: legacy-automation
      - path: .github/scripts/ai-doc-lint.test.mjs
        kind: legacy-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, retained source docs, and legacy AI-doc removal must stay aligned.
  - id: next-docs-readme-and-backlog-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: README.md
        kind: repo-landing
      - path: TODO.docs-system-gaps.md
        kind: docs-backlog
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: TODO.docs-system-gaps.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Maintainer workflow and durable docs-drift backlog must stay aligned with the repo contract.
  - id: next-docs-public-content-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: content/docs/**
        kind: public-doc-source
      - path: public/assets/docs/**
        kind: public-asset
      - path: public/favicon.ico
        kind: public-asset
      - path: public/logo.svg
        kind: public-asset
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Public pages, mirrors, and assets define what this repo publishes and must keep ownership and proof expectations aligned.
  - id: next-docs-site-structure-contract
    scope: repo
    repo: next-docs
    triggers:
      - path: package.json
        kind: site-runtime-config
      - path: tsconfig.json
        kind: site-runtime-config
      - path: next.config.ts
        kind: site-config
      - path: edgeone.json
        kind: site-deploy-config
      - path: postcss.config.mjs
        kind: site-runtime-config
      - path: pnpm-lock.yaml
        kind: site-runtime-config
      - path: pnpm-workspace.yaml
        kind: site-runtime-config
      - path: app/**
        kind: site-runtime
      - path: lib/**
        kind: site-runtime
      - path: components/**
        kind: site-runtime
      - path: crowdin.yml
        kind: translation-config
      - path: scripts/migration/**
        kind: migration-automation
      - path: manifests/**
        kind: migration-manifest
      - path: scripts/check-screenshots.mjs
        kind: docs-screenshot-validation
      - path: scripts/check-screenshots.test.mjs
        kind: docs-screenshot-validation-test
      - path: scripts/build.mjs
        kind: build-automation
      - path: scripts/check-env.mjs
        kind: build-automation
      - path: scripts/verify-out.mjs
        kind: build-automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Navigation, site config, and runtime wiring change how future docs work should be routed and checked.
  - id: next-docs-doc-governance-ci
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
      - path: .github/workflows/publish-docs.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Documentation governance automation changes alter the maintenance gate and proof expectations.
  - id: next-docs-publication-pipeline
    scope: repo
    repo: next-docs
    triggers:
      - path: .github/workflows/publish-docs.yml
        kind: publication-automation
      - path: context7.json
        kind: ai-publication-config
      - path: app/llms.txt/route.ts
        kind: ai-publication-index
      - path: app/search-records.json/route.ts
        kind: ai-publication-index
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: content/docs/deploy-and-dev/dev-env.mdx
        mode: review_or_update
      - path: content/docs/deploy-and-dev/dev-env.en.mdx
        mode: review_or_update
    reason: The publish workflow, llms.txt generator, publication scope policy, and Context7 source config define what public docs are exposed after main merges.
  - id: next-docs-local-docpact-push-gate
    scope: repo
    repo: next-docs
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.
